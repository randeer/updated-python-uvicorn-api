name: Run copilot_main on Ubuntu

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] aiomysql pyyaml jq

      - name: Start uvicorn in background
        run: |
          nohup uvicorn copilot_main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for server
        run: |
          for i in $(seq 1 15); do
            if curl -sSf http://127.0.0.1:8000/openapi.json >/dev/null 2>&1; then
              echo "Server is up"
              break
            fi
            sleep 1
          done

      - name: Smoke test - get openapi
        run: |
          curl -sSf http://127.0.0.1:8000/openapi.json | jq . | head -n 20

      - name: Smoke test - create_text_file endpoint
        run: |
          curl -sSf -X POST http://127.0.0.1:8000/create_text_file/ \
            -H "Content-Type: application/json" \
            -d '{"username":"ci-test","email":"ci@example.com","userID":9999,"userDomain":"example.com"}' \
            | jq . || true

      - name: Show uvicorn logs
        if: always()
        run: |
          echo "--- uvicorn.log (tail) ---"
          tail -n +1 uvicorn.log | sed -n '1,200p' || true

      - name: Stop uvicorn
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
          fi
